name: Deploy Site to S3 + CloudFront

# Um workflow para os dois ambientes, de proposito: os passos de build e sync
# sao identicos, e manter dois arquivos separados so criaria a chance de eles
# divergirem em silencio (foi exatamente esse tipo de duplicacao que apagou os
# 301 da migracao do WordPress -- ver scripts/cloudfront_function.py).
#
#   staging -> staging.amigoviolao.com  (noindex, ambiente de teste)
#   master  -> amigoviolao.com          (producao)

on:
  push:
    branches:
      - staging
      - master
  # Republicar sem commit novo: mudanca de secret (GA4, Brevo) nao dispara push,
  # e o build embute essas variaveis -- sem isso so um commit vazio resolveria.
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente"
        required: true
        default: staging
        type: choice
        options: [staging, producao]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Definir ambiente a partir da branch
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ inputs.ambiente }}" = "producao" ]; then
            echo "site_url=https://amigoviolao.com" >> "$GITHUB_OUTPUT"
            echo "bucket=amigo-violao-website-prod" >> "$GITHUB_OUTPUT"
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "nome=producao" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://staging.amigoviolao.com" >> "$GITHUB_OUTPUT"
            echo "bucket=amigo-violao-website-staging" >> "$GITHUB_OUTPUT"
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" >> "$GITHUB_OUTPUT"
            echo "nome=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site (static export + sitemap)
        # SITE_URL decide robots.txt, sitemap.xml, canonicals e o meta robots:
        # so o build de producao se declara indexavel.
        env:
          SITE_URL: ${{ steps.env.outputs.site_url }}
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Conferir se o build bate com o ambiente
        # Rede de seguranca contra o pior erro possivel aqui: subir para o
        # dominio real um build que se declara noindex (ou o contrario).
        run: |
          if [ "${{ steps.env.outputs.nome }}" = "producao" ]; then
            grep -q "Allow: /" out/robots.txt || { echo "robots.txt de producao bloqueando crawler"; exit 1; }
            ! grep -rq 'name="robots" content="noindex' out/index.html || { echo "Home de producao com noindex"; exit 1; }
          else
            grep -q "Disallow: /" out/robots.txt || { echo "staging sem bloqueio de crawler"; exit 1; }
          fi

      - name: Configure AWS credentials (OIDC — sem chaves estaticas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::291768628850:role/github-actions-deploy-role
          aws-region: sa-east-1

      - name: Deploy to S3 (assets, cache 1 ano)
        run: |
          aws s3 sync out/ s3://${{ steps.env.outputs.bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html"

      - name: Deploy to S3 (HTML, revalida sempre no navegador)
        # s-maxage manda no CloudFront (cacheia no edge ate a invalidacao),
        # max-age=0 manda no navegador (revalida a cada visita, respondendo 304
        # quando nada mudou). Sem isso o HTML ficava ate 1h preso no cache do
        # navegador e o deploy "sumia" -- o Ricardo ja reportou isso varias
        # vezes achando que a publicacao tinha falhado.
        run: |
          aws s3 sync out/ s3://${{ steps.env.outputs.bucket }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.env.outputs.distribution }} \
            --paths "/*"

      - name: Resumo
        run: |
          echo "Ambiente: ${{ steps.env.outputs.nome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.env.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Bucket: ${{ steps.env.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
